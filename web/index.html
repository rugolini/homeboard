<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>homeboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="blobs"><i></i><i></i><i></i></div>
<div class="wrap">
  <header>
    <div class="brand"><img data-f="House" alt=""><div><h1 id="site-name">homeboard</h1><small id="site-sub"></small></div></div>
    <div class="clock"><span id="dd"></span><b id="hh">--:--</b></div>
  </header>
  <div class="strip" id="strip"></div>

  <section class="stage-card">
    <div class="hd"><h2 data-t="map"></h2><span data-t="hover"></span></div>
    <div class="stage" id="stage"><svg class="links" viewBox="0 0 1200 860" preserveAspectRatio="none" id="links"></svg></div>
  </section>



  <div class="title"><img data-f="Money bag" alt=""><h3 data-t="costs"></h3><p data-t="costs_sub"></p></div>
  <section class="grid3 costs" id="costs"></section>

  <footer><a href="https://github.com/rugolini/homeboard">homeboard</a> · <span data-t="updated"></span> <span id="updated">—</span></footer>
</div>
<div class="modal" id="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><button class="mclose" aria-label="close">×</button><div id="mbody"></div></div></div>
<script src="app.js"></script>
</body>
</html>
